[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archscope"
version = "0.11.7"
description = "Architecture visualization and constraint tools for Codex"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "jsonschema>=4,<5",
  "mcp>=1.9,<2",
  "PyYAML>=6,<7",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "pytest>=8,<9"]

[project.scripts]
archscope = "archscope.cli:main"
archscope-mcp = "archscope.mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
